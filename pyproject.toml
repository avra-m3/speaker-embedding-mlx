[project]
name = "speaker-embedding-mlx"
version = "0.1.0"
description = "ReDimNet2 speaker-embedding models on Apple MLX (inference)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mlx>=0.32; sys_platform == 'darwin'",
    "mlx[cpu]>=0.32; sys_platform == 'linux'",
    "huggingface-hub>=0.24",
    "numpy",
    "soundfile",
]

[dependency-groups]
# Needed only for convert.py and parity.py
convert = ["torch", "scipy"]
dev = ["ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["redimnet2_mlx"]

[tool.ruff]
line-length = 100
